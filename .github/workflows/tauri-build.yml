name: Build Tauri App

on:
  release:
    types: [published]

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            javascriptcoregtk-4.1 \
            libayatana-appindicator3-dev

      - run: npm ci

      - name: Remove stale macOS Apple Silicon DMG artifacts
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          dmg_dir="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          if [ -d "$dmg_dir" ]; then
            find "$dmg_dir" -name '*.dmg' -type f -exec rm -f {} +
          fi

      - name: Build and upload Tauri release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ github.event.release.id }}
          tagName: ${{ github.event.release.tag_name }}
          releaseAssetNamePattern: "oh-my-pr-[version]-[platform]-[arch][setup].[ext]"
          args: --target ${{ matrix.target }}

      - name: Upload stable macOS Apple Silicon DMG link
        if: matrix.target == 'aarch64-apple-darwin'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p stable-assets
          dmg_dir="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          dmg_path="$(find "$dmg_dir" -name '*.dmg' -type f -print -quit)"
          test -n "$dmg_path"
          cp "$dmg_path" stable-assets/oh-my-pr-macos-arm64.dmg
          gh release upload "${{ github.event.release.tag_name }}" stable-assets/oh-my-pr-macos-arm64.dmg --clobber
